- name: Install Apache
  apt:
    name: apache2
    state: present
    update_cache: yes

- name: Change Apache listen port to 81
  lineinfile:
    path: /etc/apache2/ports.conf
    regexp: '^Listen 80'
    line: 'Listen 81'
  notify: Restart Apache

- name: Update default site config to port 81
  lineinfile:
    path: /etc/apache2/sites-available/000-default.conf
    regexp: '<VirtualHost \*:80>'
    line: '<VirtualHost *:81>'
  notify: Restart Apache

- name: Allow port 81 through firewall
  ufw:
    rule: allow
    port: '81'
    proto: tcp
  ignore_errors: yes